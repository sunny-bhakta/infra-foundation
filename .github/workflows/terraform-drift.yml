name: Terraform Drift Detection

# Run automatically every day.
#
# You can also trigger it manually from GitHub Actions.
on:
  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

# Drift detection requires:
# - repository read access
# - AWS OIDC authentication
permissions:
  contents: read
  id-token: write

# Only one drift check should run at a time.
concurrency:
  group: terraform-drift-dev
  cancel-in-progress: false

jobs:
  drift:
    name: Check Terraform Drift
    runs-on: ubuntu-latest

    environment: dev

    defaults:
      run:
        working-directory: infra/terraform/envs/dev

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Terraform
      # ---------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ---------------------------------------------------------
      # AWS Authentication
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ---------------------------------------------------------
      # Terraform Init
      # ---------------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # ---------------------------------------------------------
      # Refresh and detect changes
      # ---------------------------------------------------------
      # exit code:
      #
      # 0 = no changes
      # 1 = Terraform error
      # 2 = changes detected
      - name: Terraform Plan
        id: plan
        run: terraform plan -detailed-exitcode
        continue-on-error: true

      # ---------------------------------------------------------
      # Report result
      # ---------------------------------------------------------
      - name: Report drift
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "Terraform drift detected."
          exit 1
