name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  drift:
    name: Detect Drift
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - dev
          - stage
          - prod

    environment: ${{ matrix.environment }}

    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Drift Check
        id: drift
        run: terraform plan -detailed-exitcode -no-color
        continue-on-error: true

      - name: Report Result
        env:
          EXIT_CODE: ${{ steps.drift.outcome }}
        run: |
          echo "Terraform drift check completed."
          echo "Review the Terraform plan output for infrastructure differences."