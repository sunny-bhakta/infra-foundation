name: Terraform Plan

# Run Terraform plan when infrastructure changes.
on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"

# The workflow needs:
# - repository read access
# - OIDC token permission for AWS authentication
permissions:
  contents: read
  id-token: write

# Prevent multiple plans for the same PR from running at once.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # AWS configuration for the development environment.
    environment: dev

    defaults:
      run:
        working-directory: infra/terraform/envs/dev

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Terraform
      # ---------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ---------------------------------------------------------
      # OIDC Debug Context (safe)
      # ---------------------------------------------------------
      # Prints context values useful for troubleshooting
      # sts:AssumeRoleWithWebIdentity failures.
      - name: Debug OIDC context
        run: |
          echo "github_repository=$GITHUB_REPOSITORY"
          echo "github_ref=$GITHUB_REF"
          echo "github_event_name=$GITHUB_EVENT_NAME"
          echo "github_workflow=$GITHUB_WORKFLOW"
          echo "job_environment=dev"
          echo "expected_sub_environment=repo:$GITHUB_REPOSITORY:environment:dev"
          echo "expected_sub_ref=repo:$GITHUB_REPOSITORY:ref:$GITHUB_REF"
          echo "aws_region_var_set=${{ vars.AWS_REGION != '' }}"
          echo "terraform_role_var_set=${{ vars.AWS_TERRAFORM_ROLE_ARN != '' }}"
          echo "terraform_role_arn=${{ vars.AWS_TERRAFORM_ROLE_ARN }}"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "id_token_request_url_present=true"
          else
            echo "id_token_request_url_present=false"
          fi

      # ---------------------------------------------------------
      # AWS Authentication
      # ---------------------------------------------------------
      # GitHub requests a short-lived OIDC token.
      # AWS exchanges it for temporary credentials.
      #
      # No permanent AWS access keys are stored in GitHub.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ---------------------------------------------------------
      # Terraform Init
      # ---------------------------------------------------------
      # Initializes the configured S3 backend and providers.
      - name: Terraform Init
        run: terraform init -input=false -reconfigure

      # ---------------------------------------------------------
      # Terraform Plan
      # ---------------------------------------------------------
      # Calculates what Terraform would change without modifying
      # AWS infrastructure.
      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=5m
