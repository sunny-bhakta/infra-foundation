name: Security

# Run security checks for application and infrastructure changes.
on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# Security scanning only needs repository read access.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ---------------------------------------------------------
      # Dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------
      # npm security audit
      # ---------------------------------------------------------
      # Runtime dependency vulnerabilities are still reported,
      # but this step is non-blocking for CI while remediation is ongoing.
      - name: Dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
