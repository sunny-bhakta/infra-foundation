name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

      image_tag:
        description: "Docker image tag"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      # Checkout repository code used for Docker build context.
      - name: Checkout
        uses: actions/checkout@v4

      # Use GitHub OIDC to assume AWS role (no long-lived access keys).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Authenticate Docker client against Amazon ECR.
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build immutable image with the operator-provided tag.
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      # Push image to ECR so ECS can pull this exact tagged version.
      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Register a new ECS task definition revision with the new image tag.
      - name: Deploy to ECS
        id: deploy_ecs
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          # Final image URI used by this deployment.
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          # Capture currently running task definition for rollback.
          CURRENT_TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].taskDefinition" \
            --output text)
          echo "previous_task_definition_arn=$CURRENT_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

          # Download current task definition as JSON.
          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEF_ARN" \
            --query "taskDefinition" \
            --output json > task-definition.json

          # Fallback: if CONTAINER_NAME is not configured, update first container.
          if [ -z "$CONTAINER_NAME" ]; then
            CONTAINER_NAME=$(jq -r '.containerDefinitions[0].name' task-definition.json)
          fi

          # Replace only the target container image and strip read-only metadata fields.
          jq --arg IMAGE_URI "$IMAGE_URI" --arg CONTAINER_NAME "$CONTAINER_NAME" '
            .containerDefinitions = (
              .containerDefinitions | map(
                if .name == $CONTAINER_NAME
                then .image = $IMAGE_URI
                else .
                end
              )
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' task-definition.json > task-definition-updated.json

          # Register new task definition revision.
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-updated.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "new_task_definition_arn=$NEW_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

          # Point service to the new revision.
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEF_ARN"

      # Wait for deployment and allow rollback step to run on failure.
      - name: Wait for ECS deployment
        id: wait_ecs
        continue-on-error: true
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      # Automatic rollback to previous task definition if deployment is unstable.
      - name: Rollback ECS deployment
        if: ${{ steps.wait_ecs.outcome == 'failure' }}
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          PREVIOUS_TASK_DEF_ARN: ${{ steps.deploy_ecs.outputs.previous_task_definition_arn }}
        run: |
          echo "Deployment failed to stabilize. Rolling back to previous task definition..."
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$PREVIOUS_TASK_DEF_ARN"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "Rollback completed. Marking workflow as failed so action is visible."
          exit 1