name: Application CI

# Run CI when application-related code changes.
# Terraform has its own dedicated workflows.
on:
  pull_request:
    branches:
      - main
    paths:
      - "**"
      - "!infra/terraform/**"

  push:
    branches:
      - main
    paths:
      - "**"
      - "!infra/terraform/**"

# CI only needs to read repository contents.
permissions:
  contents: read

# Prevent multiple CI runs for the same branch/PR.
# If a new commit arrives, cancel the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Application CI
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      # Downloads the repository so the workflow can access
      # package.json, source code, tests, and configuration.
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Node.js
      # ---------------------------------------------------------
      # Installs the Node.js version used by the application.
      # npm caching speeds up future workflow executions.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ---------------------------------------------------------
      # Dependencies
      # ---------------------------------------------------------
      # npm ci provides a clean, reproducible installation
      # based on package-lock.json.
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------
      # Lint
      # ---------------------------------------------------------
      # Checks source code for style and common programming
      # mistakes.
      - name: Lint
        run: npm run lint

      # ---------------------------------------------------------
      # Tests
      # ---------------------------------------------------------
      # Runs the application's automated test suite.
      - name: Test
        run: npm test

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      # Verifies that the application can be compiled successfully.
      - name: Build
        run: npm run build
